name: Build & Release

# Every push to master → overwrites the rolling "latest" pre-release.
# Push a vX.Y tag (e.g. git tag v1.1 && git push origin v1.1) → creates a
# permanent stable release named after the tag.

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller WrapBot.spec

      - name: Publish rolling pre-release (master push)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null; true
          gh release create latest dist/WrapBot.exe `
            --title "WrapBot latest" `
            --notes "Built from ${{ github.sha }}" `
            --prerelease

      - name: Publish stable release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/WrapBot.exe `
            --title "WrapBot ${{ github.ref_name }}" `
            --notes "Stable release ${{ github.ref_name }}"
